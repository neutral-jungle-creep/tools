version: '3'

silent: true

vars:
  COVERAGE_DIR: .coverage
  MIN_UNIT_COVERAGE:
    sh: 'echo ${MIN_UNIT_COVERAGE:-50}'

  GOLANGCI_VERSION: v2.5.0

tasks:
  default:
    cmds:
      - task: info
      - task: tidy
      - task: fmt
      - task: lint
      - task: security
      - task: tests:coverage
      - task: build

  info:
    cmds:
      - echo "- Info"
      - go version

  tidy:
    cmds:
      - echo "- Tidy"
      - go mod tidy

  vendor:
    cmds:
      - echo "- Vendor"
      - go mod vendor

  fmt:
    cmds:
      - echo "- Fmt"
      - find . -path './vendor' -prune -o -name '*.go' -exec gofmt -s -w {} +
      - find . -path './vendor' -prune -o -name '*.go' -exec go run golang.org/x/tools/cmd/goimports@latest -w -local github.com/neutral-jungle-creep/tools {} +

  fmt:check:
    cmds:
      - echo "- Fmt check"
      - |
        OUT=$(find . -path './vendor' -prune -o -name '*.go' -exec gofmt -l {} +) || exit 1
        if [ -n "$OUT" ]; then
          echo "Files not gofmt-ed:"
          echo "$OUT"
          exit 1
        fi
      - |
        OUT=$(find . -path './vendor' -prune -o -name '*.go' -exec go run golang.org/x/tools/cmd/goimports@latest -l -local github.com/neutral-jungle-creep/tools {} +) || exit 1
        if [ -n "$OUT" ]; then
          echo "Files with bad imports:"
          echo "$OUT"
          exit 1
        fi

  lint:
    cmds:
      - echo "- Lint"
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}} run ./...

  lint:fix:
    cmds:
      - echo "- Lint fix"
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}} run --fix ./...

  security:
    cmds:
      - echo "- Security (govulncheck)"
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  tests:
    cmds:
      - echo "- Unit tests"
      - mkdir -p {{.COVERAGE_DIR}}
      - go test -race -count=1 -coverprofile={{.COVERAGE_DIR}}/unit.out ./...

  tests:coverage:
    cmds:
      - task: tests
      - go tool cover -html={{.COVERAGE_DIR}}/unit.out -o {{.COVERAGE_DIR}}/unit.html
      - bash scripts/check_coverage.sh {{.COVERAGE_DIR}}/unit.out {{.MIN_UNIT_COVERAGE}} ''

  build:
    cmds:
      - echo "- Build"
      - go build ./...

  clean:
    cmds:
      - echo "- Clean"
      - rm -rf {{.COVERAGE_DIR}}
